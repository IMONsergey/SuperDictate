name: API contract

on:
  pull_request:
    paths:
      - 'packages/api-contract/**'
      - '.github/workflows/api-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/api-contract/**'
      - '.github/workflows/api-contract.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/api-contract/package-lock.json

      - name: Install contract tooling
        working-directory: packages/api-contract
        run: npm ci

      - name: Lint OpenAPI
        working-directory: packages/api-contract
        run: npm run lint
